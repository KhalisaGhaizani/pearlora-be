name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  openapi:
    name: Lint OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@1.34.0 lint openapi.yaml

  images:
    name: Build & push images
    needs: [test, openapi]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      docs: ${{ steps.names.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        name: Image names (GHCR needs lowercase)
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=$repo" >> "$GITHUB_OUTPUT"
          echo "docs=$repo-docs" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Docs image (Swagger UI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile
          push: true
          build-args: |
            API_HOST=${{ vars.API_HOST || 'localhost' }}
          tags: |
            ${{ steps.names.outputs.docs }}:latest
            ${{ steps.names.outputs.docs }}:${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  deploy:
    name: Deploy to VPS
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: ~/pearlora
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          DOCS_IMAGE: ${{ needs.images.outputs.docs }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,BACKEND_IMAGE,DOCS_IMAGE,TAG
          script: |
            set -e
            cd ~/pearlora
            printf 'BACKEND_IMAGE=%s\nDOCS_IMAGE=%s\nTAG=%s\n' "$BACKEND_IMAGE" "$DOCS_IMAGE" "$TAG" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:8080/healthz; then echo; echo "Deployed $TAG"; exit 0; fi
              sleep 2
            done
            echo "Backend did not become healthy"; docker compose logs --tail 50 backend; exit 1
